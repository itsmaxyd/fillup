SourceCode: https://github.com/itsmaxyd/fillup
IssueTracker: https://github.com/itsmaxyd/fillup/issues
Donate: https://buymeacoffee.com/maxdemon

AutoName: Fillup

RepoType: git
Repo: https://github.com/itsmaxyd/fillup.git

Builds:
  - versionName: 1.1.0
    versionCode: 14
    commit: v1.1.0
    output: build/app/outputs/flutter-apk/app-release.apk
    srclibs:
      - flutter@3.35.0
    prebuild:
      - sed -i -e '/java.home/d' android/gradle.properties
      - export PUB_CACHE=$(pwd)/.pub-cache
      - export PATH="$$flutter$$/bin:$PATH"
      - flutter config --no-analytics
      - flutter pub get
    scandelete:
      - .pub-cache
    build:
      - version=$(grep -A 5 environment pubspec.yaml | grep flutter | sed "s/[^0-9.]//g")
      - git -C $$flutter$$ checkout $version
      - export PUB_CACHE=$(pwd)/.pub-cache
      - export PATH="$$flutter$$/bin:$PATH"
      - flutter build apk --release --target-platform="android-arm64"

AutoUpdateMode: Version
UpdateCheckMode: Tags
UpdateCheckData: pubspec.yaml|version:\s.+\+(\d+)|.|version:\s(.+)\+
CurrentVersion: 1.1.0
CurrentVersionCode: 14
