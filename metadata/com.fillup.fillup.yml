Builds:
  - versionName: '1.0.8'
    versionCode: 9
    commit: v1.0.8
    output: build/app/outputs/flutter-apk/app-release.apk
    srclibs:
      - flutter@3.35.0

    # ADD THIS: Install Java 17 explicitly
    sudo:
      - apt-get update || apt-get update
      - apt-get install -y openjdk-17-jdk-headless

    prebuild:
      # ADD THIS: Remove hardcoded local java path to prevent build failure
      - sed -i '/org.gradle.java.home/d' android/gradle.properties

      # ADD THIS: Set the correct Java Home for the build server
      - export JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64

      # Existing steps
      - export PUB_CACHE=$(pwd)/.pub-cache
      - export PATH="$$flutter$$/bin:$PATH"
      - flutter config --no-analytics
      - flutter pub get

    scandelete:
      - .pub-cache
    build:
      - export PUB_CACHE=$(pwd)/.pub-cache
      - export PATH="$$flutter$$/bin:$PATH"
      - flutter build apk --release --split-per-abi --target-platform="android-arm64"
