version: '3.8'

services:
  fuelprice-api:
    build: .
    container_name: fuelprice-api
    ports:
      - "8443:8443"
    volumes:
      - ./data:/app/data:z
    environment:
      # No API key required - authentication removed
      - DATABASE_URL=sqlite:///./data/fuel_prices.db
    restart: unless-stopped
    networks:
      - fuelprice-network

networks:
  fuelprice-network:
    driver: bridge
