version: '3.8'

services:
  fuelprice-api:
    build: .
    container_name: fuelprice-api
    ports:
      - "8443:8443"
    volumes:
      - ./data:/app/data:z
    environment:
      - API_KEY=sk-live-SOunjzJlol0EZA0XNRZCfb7JVYitTWZp4M4fN41R
      - DATABASE_URL=sqlite:///./data/fuel_prices.db
