plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty('flutter.versionCode')
if (flutterVersionCode == null) {
    flutterVersionCode = '1'
}

def flutterVersionName = localProperties.getProperty('flutter.versionName')
if (flutterVersionName == null) {
    flutterVersionName = '1.0.9'
}

// Signing configuration for release builds
def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('key.properties')
if (keystorePropertiesFile.exists()) {
    keystorePropertiesFile.withReader('UTF-8') { reader ->
        keystoreProperties.load(reader)
    }
}

android {
    namespace "com.fillup.fillup"
    compileSdk = 36
    ndkVersion flutter.ndkVersion
    
    splits {
        abi {
            enable false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    defaultConfig {
        applicationId "com.fillup.fillup"
        minSdkVersion flutter.minSdkVersion
        targetSdk = 36
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName
    }

    signingConfigs {
        release {
            if (keystorePropertiesFile.exists()) {
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
                storeFile keystoreProperties['storeFile'] ? file(keystoreProperties['storeFile']) : null
                storePassword keystoreProperties['storePassword']
            }
        }
    }

    buildTypes {
        release {
            // Minify for smaller APK
            minifyEnabled true
            shrinkResources true
            
            // Proguard rules
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            
            // Signing - use release config if keystore is configured, else debug for F-Droid
            if (keystorePropertiesFile.exists()) {
                signingConfig signingConfigs.release
            } else {
                signingConfig signingConfigs.debug
            }
        }
        debug {
            signingConfig signingConfigs.debug
        }
    }

    // Build reproducibility
    packaging {
        resources {
            excludes += '/META-INF/{AL2.0,LGPL2.1}'
        }
    }
}

flutter {
    source '../..'
}

dependencies {}

configurations.all {
    exclude group: "com.google.android.play", module: "core"
    exclude group: "com.google.android.play", module: "core-common"
}

// Copy APK to root build directory for Flutter to findsubprojects {
    afterEvaluate { project ->
        if (project.hasProperty("android")) {
            project.android {
                compileOptions {
                    sourceCompatibility JavaVersion.VERSION_17
                    targetCompatibility JavaVersion.VERSION_17
                }
            }
        }
    }

afterEvaluate {
    tasks.register('copyApkToBuildDir') {
        dependsOn 'assembleRelease'
        doLast {
            def apkFile = file("${buildDir}/outputs/flutter-apk/app-release.apk")
            def targetDir = file("${project.rootDir}/../build")
            if (apkFile.exists()) {
                targetDir.mkdirs()
                copy {
                    from apkFile
                    into targetDir
                }
                println "APK copied to: ${targetDir}/app-release.apk"
            } else {
                println "Warning: APK file not found at ${apkFile}"
            }
        }
    }
    
    tasks.named('assembleRelease').configure {
        finalizedBy 'copyApkToBuildDir'
    }
}

subprojects {
    afterEvaluate { project ->
        if (project.hasProperty("android")) {
            project.android {
                compileOptions {
                    sourceCompatibility JavaVersion.VERSION_17
                    targetCompatibility JavaVersion.VERSION_17
                }
            }
        }
    }
}

kotlin {
    jvmToolchain(17)
}

configurations.all {
    exclude group: 'com.google.android.play', module: 'core'
    exclude group: 'com.google.android.play', module: 'feature-delivery'
    exclude group: 'com.google.android.play', module: 'review'
    exclude group: 'com.google.android.play', module: 'app-update'
}